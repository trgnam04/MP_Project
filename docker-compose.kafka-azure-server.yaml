version: '3.8'

services:
  zookeeper:
    image: confluentinc/cp-zookeeper:6.1.0
    hostname: zookeeper
    container_name: kafka-zookeeper
    restart: always
    ports:
      - "2181:2181"
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    networks:
      - kafka-network

  broker:
    image: confluentinc/cp-kafka:6.1.0
    hostname: broker
    container_name: kafka-broker
    restart: always
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
      - "29092:29092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: 'zookeeper:2181'
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://broker:9092,PLAINTEXT_HOST://20.2.2.16:29092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_TOOLS_LOG4J_LOGLEVEL: ERROR
    networks:
      - kafka-network

  topic-setup:
    image: confluentinc/cp-kafka:6.1.0
    container_name: kafka-topic-setup
    depends_on:
      - broker
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        echo "Waiting for Kafka to be ready..." &&
        sleep 20 &&
        kafka-topics --bootstrap-server broker:9092 --list &&
        kafka-topics --bootstrap-server broker:9092 --create --topic buys-topic --partitions 1 --replication-factor 1 &&
        kafka-topics --bootstrap-server broker:9092 --create --topic clicks-topic --partitions 1 --replication-factor 1 &&
        echo 'Topics created' &&
        sleep 5
    networks:
      - kafka-network

networks:
  kafka-network:
    driver: bridge
